<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Cesta · Lista de la compra</title>
  <meta name="description" content="La Cesta: tu lista de la compra personal con catálogo de Mercadona, categorías, fotos y compras guardadas. Funciona en el móvil y se puede instalar.">
  <meta name="theme-color" content="#00753e">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Cesta">
  <link rel="stylesheet" href="css/app.css">
  <script src="data/catalog.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Sprite de iconos -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-cart" viewBox="0 0 24 24">
      <circle cx="9.2" cy="20" r="1.55"/><circle cx="18.2" cy="20" r="1.55"/>
      <path d="M2.5 3h2.1l2.3 11.1a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6.1"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24">
      <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.6" cy="7.6" r="1.5"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7h.09A1.7 1.7 0 0 0 10.12 3.14V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3v10M8 9l4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.3 3.7 2.5 17.4A1.8 1.8 0 0 0 4 20h16a1.8 1.8 0 0 0 1.5-2.6L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4.5M12 17h.01"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-package" viewBox="0 0 24 24"><path d="m12 3 9 4.5v9L12 21l-9-4.5v-9Z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9M7.5 5.2l9 4.5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4C10 4 4 8 4 15a5 5 0 0 0 5 5c7 0 11-6 11-16Z"/><path d="M4 21c2-6 6-9 11-11"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/lista" aria-label="La Cesta, ir a mi lista">
        <span class="brand-mark"><svg class="icon"><use href="#i-cart"/></svg></span>
        <span class="brand-text">
          <strong>La Cesta</strong>
          <small>Tu compra de Mercadona</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Secciones">
        <a href="#/lista" data-nav="lista"><svg class="icon"><use href="#i-list"/></svg><span>Lista</span><span class="nav-badge" id="nav-badge" hidden>0</span></a>
        <a href="#/productos" data-nav="productos"><svg class="icon"><use href="#i-package"/></svg><span>Productos</span></a>
        <a href="#/catalogo" data-nav="catalogo"><svg class="icon"><use href="#i-grid"/></svg><span>Catálogo</span></a>
        <a href="#/categorias" data-nav="categorias"><svg class="icon"><use href="#i-tag"/></svg><span>Categorías</span></a>
      </nav>

      <div class="topbar-actions">
        <button type="button" class="btn btn-install" id="install-btn" hidden data-action="install">
          <svg class="icon"><use href="#i-install"/></svg><span>Instalar</span>
        </button>
        <button type="button" class="icon-btn" data-action="open-settings" aria-label="Ajustes y datos">
          <svg class="icon"><use href="#i-settings"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="content" id="app">
    <section class="view" data-view="lista" aria-label="Lista de la compra"></section>
    <section class="view" data-view="productos" aria-label="Mis productos"></section>
    <section class="view" data-view="catalogo" aria-label="Catálogo de Mercadona"></section>
    <section class="view" data-view="categorias" aria-label="Categorías"></section>
  </main>

  <button type="button" class="fab" id="fab" data-action="new-product" aria-label="Añadir producto">
    <svg class="icon"><use href="#i-plus"/></svg>
  </button>

  <!-- Formulario de producto -->
  <dialog class="sheet" id="product-dialog" aria-labelledby="product-form-title">
    <form id="product-form" novalidate>
      <header class="sheet-head">
        <div>
          <p class="eyebrow" id="product-form-eyebrow">Nuevo producto</p>
          <h2 id="product-form-title">Añadir a La Cesta</h2>
        </div>
        <button type="button" class="icon-btn" data-action="close-dialog" data-dialog="product-dialog" aria-label="Cerrar">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </header>

      <div class="sheet-body">
        <div class="photo-field">
          <button type="button" class="photo-preview" id="photo-preview" aria-label="Elegir foto del producto">
            <img id="photo-preview-img" alt="" hidden>
            <span class="photo-placeholder" id="photo-placeholder">
              <svg class="icon"><use href="#i-camera"/></svg>
              <span>Añadir foto</span>
            </span>
          </button>
          <div class="photo-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="photo-pick">Elegir foto</button>
            <button type="button" class="btn btn-ghost btn-sm" id="photo-remove" hidden>Quitar</button>
            <span class="hint">JPG, PNG o WebP · se guarda en tu dispositivo</span>
          </div>
          <input type="file" id="photo-input" accept="image/*" hidden>
        </div>

        <label class="field">
          <span>Nombre <b aria-hidden="true">*</b></span>
          <input name="nombre" type="text" required maxlength="90" placeholder="Ej. Leche entera Hacendado" autocomplete="off" enterkeyhint="next">
        </label>

        <label class="field">
          <span>Categoría</span>
          <span class="input-row">
            <select name="categoriaId" id="product-category"></select>
            <button type="button" class="btn btn-ghost btn-square" data-action="new-category-from-product" aria-label="Crear categoría" title="Crear categoría">
              <svg class="icon"><use href="#i-plus"/></svg>
            </button>
          </span>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Cantidad</span>
            <input name="cantidad" type="number" min="0" step="0.01" value="1" inputmode="decimal">
          </label>
          <label class="field">
            <span>Unidad de medida</span>
            <select name="unidad" id="product-unit">
              <option value="ud">ud</option>
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="L">L</option>
              <option value="ml">ml</option>
              <option value="paquete">paquete</option>
              <option value="bolsa">bolsa</option>
              <option value="bandeja">bandeja</option>
              <option value="bote">bote</option>
              <option value="lata">lata</option>
              <option value="botella">botella</option>
              <option value="caja">caja</option>
              <option value="docena">docena</option>
              <option value="mazo">mazo</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Comentario</span>
          <textarea name="comentario" rows="3" maxlength="500" placeholder="Marca, tamaño, para quién, notas…"></textarea>
        </label>

        <label class="field">
          <span>Fecha de última compra</span>
          <input name="fechaCompra" type="date">
          <small id="fecha-help">Si aún no lo has comprado, se usará la fecha de entrada en la lista.</small>
        </label>

        <label class="switch-row">
          <span class="switch-copy">
            <strong>En la lista de la compra</strong>
            <small>Aparecerá en tu lista para marcarlo cuando lo compres.</small>
          </span>
          <input type="checkbox" name="enLista" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <footer class="sheet-foot">
        <button type="button" class="btn btn-ghost" data-action="close-dialog" data-dialog="product-dialog">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar producto</button>
      </footer>
    </form>
  </dialog>

  <!-- Formulario de categoría -->
  <dialog class="sheet sheet-sm" id="category-dialog" aria-labelledby="category-form-title">
    <form id="category-form" novalidate>
      <header class="sheet-head">
        <div>
          <p class="eyebrow" id="category-form-eyebrow">Nueva categoría</p>
          <h2 id="category-form-title">Crear categoría</h2>
        </div>
        <button type="button" class="icon-btn" data-action="close-dialog" data-dialog="category-dialog" aria-label="Cerrar">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </header>
      <div class="sheet-body">
        <label class="field">
          <span>Nombre <b aria-hidden="true">*</b></span>
          <input name="nombre" type="text" required maxlength="50" placeholder="Ej. Fruta y verdura" autocomplete="off">
        </label>
        <div class="field-row">
          <label class="field field-emoji">
            <span>Icono</span>
            <input name="emoji" type="text" maxlength="4" value="🛒" autocomplete="off" aria-describedby="emoji-palette">
          </label>
          <label class="field">
            <span>Color</span>
            <input name="color" type="color" value="#2e7d32">
          </label>
        </div>
        <div class="emoji-palette" id="emoji-palette" aria-label="Iconos rápidos">
          <button type="button" data-emoji="🛒">🛒</button>
          <button type="button" data-emoji="🥦">🥦</button>
          <button type="button" data-emoji="🍎">🍎</button>
          <button type="button" data-emoji="🥩">🥩</button>
          <button type="button" data-emoji="🐟">🐟</button>
          <button type="button" data-emoji="🥛">🥛</button>
          <button type="button" data-emoji="🥚">🥚</button>
          <button type="button" data-emoji="🥖">🥖</button>
          <button type="button" data-emoji="🍫">🍫</button>
          <button type="button" data-emoji="🥤">🥤</button>
          <button type="button" data-emoji="🧽">🧽</button>
          <button type="button" data-emoji="🧴">🧴</button>
          <button type="button" data-emoji="🐾">🐾</button>
          <button type="button" data-emoji="💊">💊</button>
          <button type="button" data-emoji="❄️">❄️</button>
          <button type="button" data-emoji="🍕">🍕</button>
        </div>
        <p class="hint">Puedes usar cualquier emoji como icono de la categoría.</p>
      </div>
      <footer class="sheet-foot">
        <button type="button" class="btn btn-ghost" data-action="close-dialog" data-dialog="category-dialog">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar categoría</button>
      </footer>
    </form>
  </dialog>

  <!-- Detalle de producto -->
  <dialog class="sheet sheet-sm" id="detail-dialog" aria-labelledby="detail-title">
    <div id="detail-content"></div>
  </dialog>

  <!-- Confirmación -->
  <dialog class="dialog-confirm" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <div class="confirm-icon" id="confirm-icon"><svg class="icon"><use href="#i-warning"/></svg></div>
      <h2 id="confirm-title">¿Seguro?</h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="submit" value="cancel" class="btn btn-ghost">Cancelar</button>
        <button type="submit" value="confirm" class="btn btn-danger" id="confirm-accept">Eliminar</button>
      </div>
    </form>
  </dialog>

  <!-- Ajustes -->
  <dialog class="sheet" id="settings-dialog" aria-labelledby="settings-title">
    <div id="settings-content"></div>
  </dialog>

  <input type="file" id="import-input" accept="application/json,.json" hidden>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">La Cesta necesita JavaScript para funcionar. Actívalo en tu navegador.</div>
  </noscript>
</body>
</html>
